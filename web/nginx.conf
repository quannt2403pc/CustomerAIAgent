# nginx cho service `web` — phục vụ SPA + proxy `/api` sang `api:8000`.
#
# Vì sao proxy ở đây thay vì để trình duyệt gọi thẳng `api:8000`:
# cùng origin thì **không cần CORS**, không cần preflight, và URL trong code FE
# giống hệt nhau giữa `npm run dev` (proxy của Vite) và production.

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Nén cho text; ảnh/font đã nén sẵn nên gzip lại chỉ tốn CPU.
    gzip             on;
    gzip_vary        on;
    gzip_min_length  1024;
    gzip_types       text/plain text/css application/javascript application/json
                     image/svg+xml application/manifest+json;

    # Không khai server token — bớt một mẩu thông tin cho người dò.
    server_tokens off;

    # --- Security headers (plan.md §7.4) -----------------------------------
    #
    # CSP ở đây, KHÔNG ở API: chỉ nginx mới phục vụ HTML.
    #   script-src 'self'          — bundle đã build, không có script inline
    #   style-src  'self' 'unsafe-inline' — Vite nhúng vài style inline cho
    #                                font-face/preload; `'unsafe-inline'` cho
    #                                **style** không cho chạy mã, khác hẳn với
    #                                script-src.
    #   img-src 'self' data:       — avatar đã chuẩn hoá có thể là data: URI
    #   connect-src 'self'         — FE chỉ gọi cùng origin (đã proxy /api)
    #   frame-ancestors 'none'     — tương đương X-Frame-Options: DENY
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- API ---------------------------------------------------------------
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        # Rate limit của app đọc IP thật từ đây (app/core/ratelimit.py).
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Một lần phân tích chạy hàng chục giây; timeout mặc định 60s của nginx
        # sẽ cắt ngang `POST /api/profiles` đúng lúc nó gần xong.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # KHÔNG đặt `add_header` ở đây: trong nginx, `add_header` trong một
        # `location` **xoá sạch** các header kế thừa từ `server`. Response của
        # API đã tự mang security header riêng (app/core/middleware.py).
    }

    location = /health {
        proxy_pass       http://api:8000/health;
        proxy_set_header Host $host;
    }

    # --- Tài nguyên tĩnh ---------------------------------------------------
    #
    # Tên tệp có hash nội dung (Vite) → cache dài vô tư, đổi nội dung là đổi tên.
    location /assets/ {
        # Một chỉ thị `Cache-Control` duy nhất. `expires 1y` cũng sinh ra một
        # `Cache-Control` riêng, nên dùng cả hai sẽ gửi **hai** header trùng loại
        # — trình duyệt xử lý được nhưng đó là cấu hình cẩu thả, và khi hai giá
        # trị lệch nhau thì hành vi phụ thuộc trình duyệt.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # `add_header` ở đây xoá header kế thừa, nên phải lặp lại các header an
        # toàn cần thiết cho tài nguyên tĩnh.
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # --- SPA fallback ------------------------------------------------------
    #
    # `index.html` **không** được cache: nó là tệp duy nhất trỏ tới bundle có
    # hash. Cache nó thì người dùng vẫn nạp bundle cũ sau khi deploy.
    location / {
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }
}
